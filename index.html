<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>제휴 링크 변환기</title>
    <meta name="description" content="회원가입 없는 BYOK 제휴 링크 변환기. 쿠팡 변환, 알리/여행 링크 정리, 키 없는 유틸을 제공합니다.">
    <style>
      :root{--bg:#f6f7fb;--panel:#fff;--ink:#172033;--muted:#667085;--line:#d9e0ea;--brand:#0f766e;--brand2:#0b5f59;--accent:#2563eb;--warn:#b45309;--danger:#b42318;--ok:#087443;--soft:#ecfdf5;--shadow:0 18px 50px rgba(31,41,55,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}a{color:inherit}.topbar{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(14px)}.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(1120px,calc(100% - 32px));margin:0 auto;min-height:64px}.brand{display:inline-flex;align-items:center;gap:10px;font-weight:850;text-decoration:none}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--brand);color:white;font-weight:900}.nav{display:flex;align-items:center;gap:10px}.nav a{padding:8px 10px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:750;text-decoration:none}.nav a:hover{background:#eef2f7;color:var(--ink)}.key-badge{display:inline-flex;align-items:center;min-width:42px;justify-content:center;padding:7px 10px;border-radius:999px;background:#e6f7f4;color:var(--brand2);font-size:13px;font-weight:850}.page{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:42px 0 72px}.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:28px;align-items:start}.eyebrow{margin:0 0 10px;color:var(--brand);font-size:14px;font-weight:850}h1{margin:0;max-width:720px;font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:0}.lead{margin:18px 0 0;max-width:650px;color:var(--muted);font-size:18px}.trust{margin-top:18px;display:inline-flex;max-width:100%;padding:10px 12px;border:1px solid #b7e4d8;border-radius:8px;background:#effaf7;color:#12594f;font-weight:850}.panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow)}.converter,.side-panel,.card{padding:20px}.converter{margin-top:30px}.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:8px;background:#fafbff}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:13px;font-weight:750}label{display:block;margin-bottom:8px;color:#344054;font-size:14px;font-weight:850}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font:inherit}textarea{min-height:154px;padding:14px;resize:vertical}input,select{min-height:42px;padding:9px 10px}.meta-row,.action-row,.copy-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.meta-row{margin-top:12px;color:var(--muted);font-size:14px}.action-row{margin-top:16px}.subid{display:flex;align-items:center;gap:8px;min-width:min(100%,320px);margin-left:auto}.subid span{color:var(--muted);font-size:14px;font-weight:850;white-space:nowrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font:inherit;font-weight:850;text-decoration:none;cursor:pointer}.btn:hover{border-color:#aeb8c7;background:#f8fafc}.btn.primary{border-color:var(--brand);background:var(--brand);color:white}.btn.primary:hover{background:var(--brand2)}.btn.danger{border-color:#fecdca;background:#fff4f2;color:var(--danger)}.inline-notice{display:none;margin-top:14px;padding:14px;border:1px solid #fedf89;border-radius:8px;background:#fffbeb;color:#7a4a00}.inline-notice.show{display:block}.inline-notice p{margin:0 0 10px;font-weight:850}.free-tools{display:grid;gap:8px;margin-top:12px}.free-tool{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px;border-radius:8px;background:white}.results-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:28px}.results-head h2{margin:0;font-size:22px}.results{display:grid;gap:12px;margin-top:14px}.result-card{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:14px;border:1px solid var(--line);border-radius:8px;background:white}.thumb{display:grid;place-items:center;width:72px;height:72px;border-radius:8px;background:#eef2f7;color:var(--muted);font-size:12px;font-weight:850}.result-title{margin:0 0 6px;font-weight:900}.url-line{display:block;overflow-wrap:anywhere;color:var(--accent);font-size:14px}.card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.tag{display:inline-flex;align-items:center;min-height:28px;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3447a8;font-size:12px;font-weight:900}.tag.warn{background:#fff7ed;color:var(--warn)}.tag.ok{background:var(--soft);color:var(--ok)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}.doc{max-width:820px}.masked{color:var(--muted);font-size:13px;font-weight:750}.toast{position:fixed;right:18px;bottom:18px;z-index:20;max-width:min(360px,calc(100% - 36px));padding:12px 14px;border-radius:8px;background:#101828;color:white;opacity:0;transform:translateY(10px);transition:.18s ease}.toast.show{opacity:1;transform:translateY(0)}dialog{border:0;border-radius:8px;padding:18px;box-shadow:var(--shadow)}dialog::backdrop{background:rgba(15,23,42,.4)}dialog img{display:block;width:220px;height:220px;margin:12px auto}@media(max-width:820px){.hero,.grid{grid-template-columns:1fr}.topbar-inner{align-items:flex-start;flex-direction:column;padding:12px 0}.nav{width:100%;overflow-x:auto}.subid{width:100%;margin-left:0}.results-head{align-items:stretch;flex-direction:column}.result-card{grid-template-columns:64px minmax(0,1fr)}.thumb{width:64px;height:64px}}
    </style>
  </head>
  <body>
    <header class="topbar"><div class="topbar-inner"><a class="brand" href="/" data-link><span class="brand-mark">A</span><span>Affiliate Link Cleaner</span></a><nav class="nav"><a href="/guide" data-link>가이드</a><a href="/settings" data-link>설정</a><span class="key-badge" id="keyBadge">키 0개</span></nav></div></header>
    <main class="page" id="app"></main>
    <dialog id="qrDialog"><strong>QR 코드</strong><img id="qrImage" alt="QR code"><a class="url-line" id="qrLink" target="_blank" rel="noreferrer"></a><form method="dialog"><button class="btn primary" type="submit">닫기</button></form></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      const PROVIDERS={coupang:{name:"쿠팡파트너스",fields:["accessKey","secretKey"]},aliexpress:{name:"알리익스프레스",fields:["appKey","appSecret","trackingId"]},myrealtrip:{name:"마이리얼트립",fields:["partnerKey"]},tenping:{name:"텐핑",fields:[]}};
      const KEY_STORAGE="affiliate-link-credentials-v1",HISTORY_STORAGE="affiliate-link-history-v1";
      const $=(s,r=document)=>r.querySelector(s),$all=(s,r=document)=>Array.from(r.querySelectorAll(s));
      const esc=(v)=>String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
      function readKeys(){try{return JSON.parse(localStorage.getItem(KEY_STORAGE)||"{}")}catch{return {}}}
      function writeKeys(keys){localStorage.setItem(KEY_STORAGE,JSON.stringify(keys));updateKeyBadge()}
      function updateKeyBadge(){const b=$("#keyBadge");if(b)b.textContent=`키 ${Object.values(readKeys()).filter(v=>v&&Object.values(v).some(Boolean)).length}개`}
      function toast(msg){const n=$("#toast");n.textContent=msg;n.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>n.classList.remove("show"),2200)}
      function urls(){return ($("#urlInput")?.value||"").split(/\s+/).map(v=>v.trim()).filter(Boolean)}
      async function api(path,body){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.message||p.error||"요청 실패");return p}
      function home(){return `<section class="hero"><div><p class="eyebrow">BYOK 멀티 제휴사 도구</p><h1>제휴 링크, 한 번에 변환하세요</h1><p class="lead">쿠팡 · 알리 · 마이리얼트립 링크를 감지하고, 키가 없을 때도 추적 파라미터 제거와 링크 검사를 바로 사용할 수 있습니다.</p><p class="trust">API 키는 브라우저에만 저장됩니다.</p><section class="panel converter"><label for="urlInput">상품 URL을 붙여넣으세요</label><textarea id="urlInput" placeholder="여러 줄 붙여넣기 = 대량 변환&#10;https://www.coupang.com/vp/products/8597899327?..."></textarea><div class="meta-row" id="detectMeta">감지됨: 없음</div><div class="action-row"><button class="btn primary" id="convertBtn">변환하기</button><button class="btn" id="cleanBtn">추적 제거</button><button class="btn" id="validateBtn">유효성 검사</button><label class="subid"><span>서브ID</span><input id="subId" placeholder="blog"></label></div><div class="inline-notice" id="keyNotice"><p id="keyNoticeText">제휴 링크 변환에는 API 키가 필요합니다.</p><div class="card-actions"><a class="btn primary" href="/settings" data-link>키 등록하기</a><a class="btn" href="/guide" data-link>발급 방법 보기</a></div><div class="free-tools"><div class="free-tool"><span>추적 파라미터 제거</span><button class="btn" onclick="document.getElementById('cleanBtn').click()">실행</button></div><div class="free-tool"><span>링크 유효성 검사</span><button class="btn" onclick="document.getElementById('validateBtn').click()">실행</button></div></div></div></section></div><aside class="panel side-panel"><div class="stat-grid"><div class="stat"><b>0</b><span>서버 저장 키</span></div><div class="stat"><b>30</b><span>분당 요청 제한</span></div><div class="stat"><b>50</b><span>최근 기록 보관</span></div><div class="stat"><b>3</b><span>MVP 대상 제휴사</span></div></div><p class="lead">변환 결과는 공식 제휴사 링크 그대로 반환합니다. 자체 도메인으로 감싸지 않습니다.</p></aside></section><section><div class="results-head"><h2>결과 <span id="resultCount">(0건)</span></h2><div class="copy-row"><select id="copyFormat"><option value="text">텍스트</option><option value="markdown">마크다운</option><option value="html">HTML</option></select><button class="btn" id="copyAllBtn">전체 복사</button></div></div><div class="results" id="results"></div></section>`}
      function settings(){const keys=readKeys();return `<p class="eyebrow">API 키 관리</p><h1>키는 이 브라우저에만 저장됩니다</h1><p class="lead">서버 저장은 없습니다. 저장 시 연결 테스트가 성공해야 확정됩니다.</p><section class="grid">${Object.entries(PROVIDERS).map(([id,p])=>{const saved=keys[id]||{},reg=Object.values(saved).some(Boolean);return `<article class="panel card"><h2>${p.name} <span class="tag ${reg?"ok":"warn"}">${reg?"등록됨":"미등록"}</span></h2><p class="masked">${reg?Object.entries(saved).map(([k,v])=>`${k} ${mask(v)}`).join(" · "):"저장된 키가 없습니다."}</p>${p.fields.map(f=>`<label>${f}<input data-provider="${id}" data-field="${f}" value="${esc(saved[f]||"")}" autocomplete="off"></label>`).join("")||"<p class='masked'>공개 API 확인 전까지 안내 전용입니다.</p>"}<div class="card-actions"><button class="btn primary" data-save="${id}" ${p.fields.length?"":"disabled"}>연결 테스트</button><button class="btn danger" data-del="${id}">삭제</button></div></article>`}).join("")}</section><div class="action-row"><button class="btn danger" id="deleteAll">모든 키 삭제</button><a class="btn" href="/" data-link>변환기로 돌아가기</a></div>`}
      function guide(path){const pages={coupang:["쿠팡파트너스","Access Key와 Secret Key를 발급한 뒤 설정 화면에서 연결 테스트를 실행하세요. 쿠팡 deeplink API는 HMAC-SHA256 서명으로 호출합니다."],aliexpress:["알리익스프레스","현재는 spm, _gl 등 추적 파라미터 정리를 지원합니다. Portals API 기본 국가와 통화값 확정 후 변환을 연결합니다."],myrealtrip:["마이리얼트립","파트너 등록과 공식 API 규격 확인 후 BYOK 어댑터를 연결합니다."],tenping:["텐핑","공개 변환 API 확인 전까지 안내 전용으로 운영합니다."]};const key=path.split("/").pop();if(pages[key])return `<div class="doc"><p class="eyebrow">가이드</p><h1>${pages[key][0]}</h1><p class="lead">${pages[key][1]}</p><p><a class="btn primary" href="/" data-link>변환기 열기</a> <a class="btn" href="/settings" data-link>설정</a></p></div>`;return `<p class="eyebrow">시작 가이드</p><h1>제휴사별 키 발급과 변환 준비</h1><p class="lead">초기 버전은 쿠팡파트너스 변환과 무료 링크 정리를 우선 제공합니다.</p><section class="grid">${["coupang","aliexpress","myrealtrip","tenping"].map(k=>`<a class="panel card" href="/guide/${k}" data-link><h2>${pages[k][0]}</h2><p>${pages[k][1]}</p></a>`).join("")}</section>`}
      function legal(kind){return `<div class="doc"><h1>${kind==="privacy"?"개인정보 처리방침":kind==="terms"?"이용약관":"문의"}</h1><p class="lead">${kind==="privacy"?"API 키는 서버에 저장하지 않고 브라우저 localStorage에만 저장됩니다.":kind==="terms"?"각 제휴사의 약관과 정책 준수 책임은 사용자에게 있습니다.":"오류 제보와 제휴사 추가 요청은 GitHub 이슈로 남겨주세요."}</p><p><a class="btn" href="/" data-link>돌아가기</a></p></div>`}
      function mask(v){return !v?"미등록":v.length<9?`${v.slice(0,2)}••••`:`${v.slice(0,4)}••••••••${v.slice(-3)}`}
      function render(){const p=location.pathname;$("#app").innerHTML=p==="/settings"?settings():p.startsWith("/guide")?guide(p):p==="/privacy"||p==="/terms"||p==="/contact"?legal(p.slice(1)):home();updateKeyBadge();bind()}
      async function detectInput(){const list=urls();if(!list.length){$("#detectMeta").textContent="감지됨: 없음";return []}const r=await api("/api/detect",{urls:list});const c=r.results.reduce((a,i)=>(a[i.providerName]=(a[i.providerName]||0)+1,a),{});$("#detectMeta").textContent="감지됨: "+Object.entries(c).map(([k,v])=>`${k} ${v}`).join(" · ");return r.results}
      function resultUrl(i){return i.shortUrl||i.cleanUrl||i.landingUrl||i.originalUrl}
      function showResults(results){$("#resultCount").textContent=`${results.length}건`;$("#results").innerHTML=results.map(i=>{const ok=i.status==="ok",u=resultUrl(i),title=i.title||(ok?"처리 완료":"처리 실패");return `<article class="result-card" data-url="${esc(u)}" data-title="${esc(title)}"><div class="thumb">${ok?"LINK":"WARN"}</div><div><p class="result-title">${esc(title)}</p><span class="tag ${ok?"ok":"warn"}">${ok?"완료":esc(i.code||"경고")}</span><a class="url-line" href="${esc(u)}" target="_blank" rel="noreferrer">${esc(u)}</a>${i.message?`<p class="masked">${esc(i.message)}</p>`:""}<div class="card-actions"><button class="btn" data-copy="${esc(u)}">복사</button><button class="btn" data-qr="${esc(u)}">QR</button><a class="btn" href="${esc(i.originalUrl)}" target="_blank" rel="noreferrer">원본</a></div></div></article>`}).join("");localStorage.setItem(HISTORY_STORAGE,JSON.stringify([{savedAt:new Date().toISOString(),results},...JSON.parse(localStorage.getItem(HISTORY_STORAGE)||"[]")].slice(0,50)))}
      async function convert(){const d=await detectInput(),provider=d.find(i=>i.supported)?.provider;if(!provider)return toast("공식 변환 가능한 URL이 없습니다.");const keys=readKeys()[provider];if(!keys){$("#keyNotice").classList.add("show");$("#keyNoticeText").textContent=`${PROVIDERS[provider].name} 변환에는 API 키가 필요합니다.`;return}const r=await api("/api/convert",{provider,urls:urls(),subId:$("#subId").value,credentials:keys});showResults(r.results)}
      async function clean(){const r=await api("/api/clean",{urls:urls()});showResults(r.results);toast("추적 파라미터를 정리했습니다.")}
      async function validate(){const r=await api("/api/detect",{urls:urls()});showResults(r.results.map(i=>({originalUrl:i.originalUrl,status:i.normalizedUrl?"ok":"error",cleanUrl:i.normalizedUrl||i.originalUrl,title:`${i.providerName} 링크 검사`,code:i.supported?"CONVERTIBLE":"CLEAN_ONLY",message:i.supported?"변환 가능한 제휴사입니다.":i.reason})))}
      function bind(){document.body.onclick=async(e)=>{const a=e.target.closest("a[data-link]");if(a){e.preventDefault();history.pushState(null,"",a.href);render()}const cp=e.target.closest("[data-copy]");if(cp)navigator.clipboard.writeText(cp.dataset.copy).then(()=>toast("복사했습니다."));const qr=e.target.closest("[data-qr]");if(qr){$("#qrImage").src=`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(qr.dataset.qr)}`;$("#qrLink").href=qr.dataset.qr;$("#qrLink").textContent=qr.dataset.qr;$("#qrDialog").showModal()}const save=e.target.closest("[data-save]");if(save){const id=save.dataset.save,credentials={};$all(`[data-provider="${id}"]`).forEach(i=>credentials[i.dataset.field]=i.value.trim());save.textContent="테스트 중";try{const r=await api("/api/verify",{provider:id,credentials});if(!r.ok)throw new Error(r.message);const k=readKeys();k[id]=credentials;writeKeys(k);toast("저장했습니다.");render()}catch(err){toast(err.message||"연결 테스트 실패")}finally{save.textContent="연결 테스트"}}const del=e.target.closest("[data-del]");if(del){const k=readKeys();delete k[del.dataset.del];writeKeys(k);render();toast("삭제했습니다.")}};$("#urlInput")?.addEventListener("input",()=>{clearTimeout(window.__detect);window.__detect=setTimeout(detectInput,220)});$("#convertBtn")?.addEventListener("click",convert);$("#cleanBtn")?.addEventListener("click",clean);$("#validateBtn")?.addEventListener("click",validate);$("#copyAllBtn")?.addEventListener("click",()=>{const rows=$all(".result-card").map(c=>({title:c.dataset.title,url:c.dataset.url})),f=$("#copyFormat").value;let t=rows.map(r=>r.url).join("\n");if(f==="markdown")t=rows.map(r=>`[${r.title}](${r.url})`).join("\n");if(f==="html")t=rows.map(r=>`<a href="${r.url}">${esc(r.title)}</a>`).join("<br>\n");navigator.clipboard.writeText(t).then(()=>toast("전체 복사했습니다."))});$("#deleteAll")?.addEventListener("click",()=>{localStorage.removeItem(KEY_STORAGE);render();toast("모든 키를 삭제했습니다.")})}
      window.onpopstate=render;render();
    </script>
  </body>
</html>
